# Local development and the CI smoke test. The password defaults below exist so `docker compose up` works out
# of the box; never reuse them anywhere shared. Override them in a .env file (git-ignored).
name: mini-erp

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mini_erp
      POSTGRES_USER: mini_erp
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mini_erp_local}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Runs only when the volume is created: adds the mini_erp_test database for ./mvnw verify.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_erp -d mini_erp"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
    image: ${APP_IMAGE:-mini-erp:local}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/mini_erp
      DB_USERNAME: mini_erp
      DB_PASSWORD: ${DB_PASSWORD:-mini_erp_local}
      MINIERP_TIME_ZONE: ${MINIERP_TIME_ZONE:-America/Sao_Paulo}
      # Login: user "admin" (MINIERP_ADMIN_USER) with this password. Local default only, like DB_PASSWORD.
      MINIERP_ADMIN_USER: ${ADMIN_USER:-admin}
      MINIERP_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin_local}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    # Least privilege: read-only root filesystem (Tomcat and JasperReports only write to /tmp), no Linux
    # capabilities, no privilege escalation, bounded memory.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 768m
    restart: unless-stopped

volumes:
  db-data:
