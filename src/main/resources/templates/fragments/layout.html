<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Mini ERP'">Mini ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="nav(section)" class="topbar">
    <a class="brand" th:href="@{/}">Mini ERP</a>
    <nav>
        <a th:href="@{/products}" th:attr="aria-current=${section == 'products'} ? 'page' : null">Produtos</a>
        <a th:href="@{/customers}" th:attr="aria-current=${section == 'customers'} ? 'page' : null">Clientes</a>
        <a th:href="@{/sales}" th:attr="aria-current=${section == 'sales'} ? 'page' : null">Vendas</a>
        <a th:href="@{/reports/sales}" th:attr="aria-current=${section == 'reports'} ? 'page' : null">Relatórios</a>
    </nav>
</header>
<th:block th:fragment="notice">
    <div th:if="${notice}" class="notice" role="status" th:text="${notice}"></div>
    <div th:if="${alert}" class="alert" role="alert" th:text="${alert}"></div>
</th:block>
</body>
</html>
