<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title th:text="${title} + ' · Mini ERP'">Mini ERP</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' fill='white' text-anchor='middle'%3EM%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/designeer-theme.css}">
</head>
<body>
<header th:fragment="nav(section)" class="topbar">
    <a class="brand" th:href="@{/}">Mini ERP</a>
    <nav>
        <a th:href="@{/}" th:attr="aria-current=${section == 'home'} ? 'page' : null"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg><span>Início</span></a>
        <a th:href="@{/products}" th:attr="aria-current=${section == 'products'} ? 'page' : null"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5"/><path d="M12 13v8"/></svg><span>Produtos</span></a>
        <a th:href="@{/customers}" th:attr="aria-current=${section == 'customers'} ? 'page' : null"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8"/><path d="M18 14.8c1.8.7 3 2.4 3.5 5.2"/></svg><span>Clientes</span></a>
        <a th:href="@{/sales}" th:attr="aria-current=${section == 'sales'} ? 'page' : null"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg><span>Vendas</span></a>
        <a th:href="@{/reports/sales}" th:attr="aria-current=${section == 'reports'} ? 'page' : null"><svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18"/><path d="M6 17v-5M11 17V7M16 17v-8M21 17V4"/></svg><span>Relatórios</span></a>
    </nav>
    <form class="session" sec:authorize="isAuthenticated()" method="post" th:action="@{/logout}">
        <span class="session__user" sec:authentication="name">admin</span>
        <button type="submit">Sair</button>
    </form>
</header>
<th:block th:fragment="notice">
    <div th:if="${notice}" class="notice" role="status" th:text="${notice}"></div>
    <div th:if="${alert}" class="alert" role="alert" th:text="${alert}"></div>
</th:block>
<th:block th:fragment="saleStatus(sale)">
    <span th:if="${sale.cancelled}" class="pill pill--danger">Cancelada</span>
    <span th:unless="${sale.cancelled}" class="pill">Confirmada</span>
</th:block>
</body>
</html>
