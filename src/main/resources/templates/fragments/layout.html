<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Mini ERP'">Mini ERP</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="nav(section)" class="topbar">
    <a class="brand" th:href="@{/}">Mini ERP</a>
    <nav>
        <a th:href="@{/products}" th:attr="aria-current=${section == 'products'} ? 'page' : null">Produtos</a>
    </nav>
</header>
<div th:fragment="notice" th:if="${notice}" class="notice" role="status" th:text="${notice}"></div>
</body>
</html>
