spring:
  application:
    name: mini-erp
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mini_erp}
    username: ${DB_USERNAME:mini_erp}
    password: ${DB_PASSWORD:}
    hikari:
      data-source-properties:
        # PostgreSQL puts the offending row in error details ("Key (document)=(...)"), which would log a CPF.
        logServerErrorDetail: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  thymeleaf:
    cache: false
  data:
    web:
      pageable:
        max-page-size: 50

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      tracking-modes: cookie
  error:
    include-stacktrace: never
    include-message: never

minierp:
  admin:
    username: ${MINIERP_ADMIN_USER:admin}
    # Required, at least 8 characters; the app does not start without it.
    password: ${MINIERP_ADMIN_PASSWORD:}
  # Zone used to show dates; they are stored as instants (TIMESTAMPTZ).
  time-zone: ${MINIERP_TIME_ZONE:America/Sao_Paulo}
