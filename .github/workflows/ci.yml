name: ci

# Every PR and every push to main: build, tests against PostgreSQL with the coverage gate, then the
# container image brought up with docker compose and exercised like a user would.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mini_erp_test
          POSTGRES_USER: mini_erp
          POSTGRES_PASSWORD: mini_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mini_erp -d mini_erp_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      MINIERP_TEST_JDBC_URL: jdbc:postgresql://localhost:5432/mini_erp_test
      MINIERP_TEST_DB_USER: mini_erp
      MINIERP_TEST_DB_PASSWORD: mini_erp_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test and coverage gate
        run: ./mvnw -B verify
      - name: No integration test may be skipped
        run: |
          skipped=$(grep -ho 'skipped="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "skipped tests: $skipped"
          test "$skipped" -eq 0
      - name: Test summary
        if: always()
        run: |
          {
            echo "### Tests"
            grep -ho 'tests="[0-9]*" errors="[0-9]*" skipped="[0-9]*" failures="[0-9]*"' target/surefire-reports/TEST-*.xml \
              | awk -F'"' '{t+=$2;e+=$4;s+=$6;f+=$8} END {printf "%d tests, %d failures, %d errors, %d skipped\n", t, f, e, s}'
            echo "### Coverage"
            awk -F, 'NR>1 {lm+=$8; lc+=$9; bm+=$6; bc+=$7} END {printf "lines %.1f%%, branches %.1f%%\n", 100*lc/(lm+lc), 100*bc/(bm+bc)}' \
              target/site/jacoco/jacoco.csv
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore

  compose:
    # The README's `docker compose up --build`, walked end to end: health, login, CSRF, a sale with stock
    # deduction, the PDF report, then a real Chrome checking every page for CSP violations and JS errors.
    name: compose
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Container is healthy and hardened
        run: |
          set -euo pipefail
          id=$(docker compose ps -q app)
          test "$(docker inspect -f '{{.State.Health.Status}}' "$id")" = healthy
          test "$(docker inspect -f '{{.Config.User}}' "$id")" = 10001
          test "$(docker inspect -f '{{.HostConfig.ReadonlyRootfs}}' "$id")" = true
          curl -sf http://localhost:8080/actuator/health | grep -q '"UP"'
      - name: Anonymous visitors are sent to the login page
        run: |
          curl -s -o /dev/null -w '%{http_code} %{redirect_url}\n' http://localhost:8080/products | tee status.txt
          grep -q '^302 http://localhost:8080/login$' status.txt
      - name: Smoke path
        run: |
          set -euo pipefail
          source scripts/session.sh
          login http://localhost:8080 admin admin_local
          post /products -d 'name=Caneta&sku=CN-01&price=2.50&stockQuantity=10&active=true' > /dev/null
          [[ $(post /sales -d 'paymentMethod=PIX&items[0].productId=1&items[0].quantity=3') == */sales/1 ]]
          [[ $(page /products) == *'>7<'* ]]
          today=$(TZ=America/Sao_Paulo date +%F)
          curl -sf -b "$JAR" -o report.pdf "http://localhost:8080/reports/sales.pdf?from=$today&to=$today"
          head -c 5 report.pdf | grep -q '%PDF-'
          docker compose exec -T db psql -U mini_erp -tAc "select 1 from pg_database where datname = 'mini_erp_test'" | grep -q 1
      - name: Without a CSRF token a logged-in POST is refused
        run: |
          source scripts/session.sh
          login http://localhost:8080 admin admin_local
          code=$(curl -s -b "$JAR" -o /dev/null -w '%{http_code}' -X POST http://localhost:8080/products -d 'name=X&sku=X-1&price=1&stockQuantity=1')
          echo "status: $code"; test "$code" = 403
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Every page in a real browser (CSP, JS errors, failed requests)
        run: node scripts/browser-check.mjs http://localhost:8080 admin admin_local
      - name: No CPF-shaped value in the application logs
        run: |
          docker compose logs --no-color app > app.log
          if grep -E '(^|[^0-9])([0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}|[0-9]{11})([^0-9]|$)' app.log; then
            echo "CPF-shaped value found in the logs"; exit 1
          fi
      - if: failure()
        run: docker compose logs --no-color | tail -300
      - if: always()
        run: docker compose down -v
